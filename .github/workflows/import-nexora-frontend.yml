name: Import Nexora Frontend

on:
  push:
    branches:
      - feat/import-nexora-frontend

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Checkout generated frontend
        uses: actions/checkout@v4
        with:
          repository: NexoraPlatform/frontend
          path: .tmp/nexora-frontend
          fetch-depth: 1

      - name: Import frontend source
        shell: bash
        run: |
          set -euo pipefail
          target="apps/nexora-office/web"
          source=".tmp/nexora-frontend"

          mkdir -p "$target"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='coverage/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.*.local' \
            --exclude='package-lock.json' \
            "$source/" "$target/"

          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/nexora-office/web/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.name = '@nexora/nexora-office-web';
          pkg.private = true;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          rm -rf .tmp

      - name: Commit imported frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/nexora-office/web
          git status --short
          if git diff --cached --quiet; then
            echo "No frontend changes to commit."
            exit 0
          fi
          git commit -m "feat(frontend): import generated Nexora frontend"
          git push origin HEAD:${{ github.ref_name }}
