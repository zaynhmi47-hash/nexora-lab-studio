name: Backend CI

on:
  push:
    paths:
      - "services/nexora-api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/nexora-api/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nexora-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/nexora-api/requirements/development.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements/development.txt

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          SECRET_KEY: ci-only-secret-key-for-django-tests-2026
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check

      - name: Check migrations are up to date
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          SECRET_KEY: ci-only-secret-key-for-django-tests-2026
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          SECRET_KEY: ci-only-secret-key-for-django-tests-2026
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py migrate --noinput

      - name: Ruff
        run: ruff check .

      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          SECRET_KEY: ci-only-secret-key-for-django-tests-2026
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: pytest -q
