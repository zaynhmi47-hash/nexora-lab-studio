name: Regenerate workspace lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-pnpm-lock.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Regenerate lockfile from every workspace manifest
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Workspace lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(monorepo): regenerate pnpm workspace lockfile"
          git push origin HEAD:main
