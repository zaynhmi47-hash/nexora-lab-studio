name: Frontend CI

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'apps/**/mobile/**'
      - 'apps/**/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/**/mobile/**'
      - 'apps/**/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'

jobs:
  finance-mobile-typecheck:
    name: Finance mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexora-finance/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  nexverse-mobile-typecheck:
    name: Nexverse mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexverse/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  dignity-mobile-typecheck:
    name: Dignity mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dignity/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  workspace-typecheck:
    name: Workspace app typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Nexora Core mobile
            package: '@nexora/mobile'
            script: typecheck
          - app: Nexora Muslim mobile
            package: nexora-muslim-mobile
            script: typecheck
          - app: Dating mobile
            package: '@nexora/dating-social-professional-mobile'
            script: typecheck
          - app: Dignity web
            package: '@nexora/dignity-web'
            script: typecheck
          - app: Nexora Office web
            package: '@nexora/nexora-office-web'
            script: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter "${{ matrix.package }}" ${{ matrix.script }}
