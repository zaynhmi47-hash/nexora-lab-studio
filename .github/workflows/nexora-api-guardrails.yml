name: Nexora API Guardrails

on:
  pull_request:
    paths:
      - "services/nexora-api/**"
      - ".github/workflows/nexora-api-guardrails.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "services/nexora-api/**"
      - ".github/workflows/nexora-api-guardrails.yml"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nexora-api

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: sqlite:///ci.sqlite3
      DATABASE_CONN_MAX_AGE: "0"
      DATABASE_CONN_HEALTH_CHECKS: "True"
      FIREBASE_PROJECT_ID: nexora-73cfa
      CONTROL_PLANE_BOOTSTRAP_EMAILS: ""
      CONTROL_PLANE_SESSION_AGE: "1800"
      CONTROL_PLANE_LOGIN_RATE_LIMIT: "5"
      CONTROL_PLANE_AUDIT_RETENTION_DAYS: "0"
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: "0"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      SECURE_HSTS_PRELOAD: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level WARNING

      - name: Django migration consistency check
        run: python manage.py makemigrations --check --dry-run

      - name: Control Plane tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          pytest apps/control_plane -q

      - name: Full backend test suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          pytest -q
