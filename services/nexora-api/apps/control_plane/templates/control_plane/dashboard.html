<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexora Control Plane</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a2d; --line:#26324d; --text:#edf2ff; --muted:#8f9bb5; --ok:#55d187; --warn:#f3c969; --bad:#ff6b7a; }
    * { box-sizing:border-box; } body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .shell { max-width:1440px; margin:auto; padding:28px; } header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px; }
    h1,h2 { margin:0; } h1 { font-size:24px; } h2 { font-size:16px; margin-bottom:14px; } .muted { color:var(--muted); }
    .badge { border:1px solid var(--line); border-radius:999px; padding:5px 10px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; } .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
    .metric { font-size:28px; font-weight:700; margin-top:4px; } .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .section { margin-top:18px; } .services { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .service { border:1px solid var(--line); border-radius:12px; padding:14px; } .row { display:flex; justify-content:space-between; gap:12px; }
    .status { font-size:12px; font-weight:700; } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); font-size:12px; }
    code { color:#b8c7ff; } .two { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; } .scroll { max-height:420px; overflow:auto; }
    @media(max-width:900px){ .grid,.two { grid-template-columns:1fr 1fr; } } @media(max-width:600px){ .shell{padding:16px}.grid,.two{grid-template-columns:1fr} }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="label">Nexora Backend</div><h1>Control Plane</h1><div class="muted">Local development observability • auto refresh 3s</div></div>
    <div class="badge" id="updated">connecting…</div>
  </header>

  <div class="grid">
    <div class="panel"><div class="label">Database</div><div class="metric" id="db">—</div><div class="muted" id="dbDetail"></div></div>
    <div class="panel"><div class="label">Firebase</div><div class="metric" id="firebase">—</div></div>
    <div class="panel"><div class="label">API routes</div><div class="metric" id="routes">—</div></div>
    <div class="panel"><div class="label">Requests</div><div class="metric" id="requests">—</div></div>
  </div>

  <section class="section panel"><h2>Services</h2><div class="services" id="services"></div></section>

  <section class="section two">
    <div class="panel"><h2>API groups</h2><div class="scroll"><table><thead><tr><th>Group</th><th>Routes</th></tr></thead><tbody id="groups"></tbody></table></div></div>
    <div class="panel"><h2>Recent requests</h2><div class="scroll"><table><thead><tr><th>Method</th><th>Path</th><th>Status</th><th>ms</th></tr></thead><tbody id="activity"></tbody></table></div></div>
  </section>

  <section class="section panel"><h2>Route inventory</h2><div class="scroll"><table><thead><tr><th>Route</th><th>Name</th><th>Kind</th></tr></thead><tbody id="routeList"></tbody></table></div></section>
</div>
<script>
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusClass = s => ["healthy","configured","available","ok","200"].includes(String(s).toLowerCase()) ? "ok" : ["degraded","pending","not-configured"].includes(String(s).toLowerCase()) ? "warn" : "bad";
async function refresh() {
  try {
    const r = await fetch("./snapshot/", {cache:"no-store"});
    const d = await r.json();
    document.getElementById("db").innerHTML = d.database.ok ? '<span class="ok">OK</span>' : '<span class="bad">DOWN</span>';
    document.getElementById("dbDetail").textContent = d.database.detail;
    document.getElementById("firebase").innerHTML = d.firebase.configured ? '<span class="ok">READY</span>' : '<span class="warn">CONFIG</span>';
    document.getElementById("routes").textContent = d.api_route_count;
    document.getElementById("requests").textContent = d.recent_requests.length;
    document.getElementById("updated").textContent = new Date().toLocaleTimeString();

    document.getElementById("services").innerHTML = d.services.map(s =>
      '<div class="service"><div class="row"><strong>'+esc(s.name)+'</strong><span class="status '+statusClass(s.status)+'">'+esc(s.status)+'</span></div><div class="muted">'+esc(s.kind)+'</div><div style="margin-top:8px">'+esc(s.description)+'</div></div>'
    ).join("");

    document.getElementById("groups").innerHTML = d.api_groups.map(g => '<tr><td><code>/api/v1/'+esc(g.name)+'</code></td><td>'+g.routes+'</td></tr>').join("");
    document.getElementById("activity").innerHTML = d.recent_requests.map(x =>
      '<tr><td>'+esc(x.method)+'</td><td><code>'+esc(x.path)+'</code></td><td class="'+statusClass(x.status_code)+'">'+x.status_code+'</td><td>'+x.duration_ms+'</td></tr>'
    ).join("") || '<tr><td colspan="4" class="muted">No requests yet</td></tr>';
    document.getElementById("routeList").innerHTML = d.routes.map(x =>
      '<tr><td><code>'+esc(x.route)+'</code></td><td>'+esc(x.name)+'</td><td>'+esc(x.kind)+'</td></tr>'
    ).join("");
  } catch (e) {
    document.getElementById("updated").textContent = "offline";
  }
}
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
